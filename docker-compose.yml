services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sports
      POSTGRES_PASSWORD: sports
      POSTGRES_DB: sportsdb
    ports:
      - "5434:5432"   # non-default host port: 5432/5433 are taken by local installs
    volumes:
      - sports_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports -d sportsdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      SPORTS_DATABASE_URL: postgresql+asyncpg://sports:sports@db:5432/sportsdb
      SPORTS_REDIS_URL: redis://redis:6379/0
      SPORTS_JWT_SECRET: ${SPORTS_JWT_SECRET:?set in .env}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  sports_pgdata:
